<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="assets/caipsd-mark.png" type="image/png">
  <title>Your CAIPSD Ticket | The Islamia University of Bahawalpur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/ticket.css" />
</head>
<body>
  <header class="ticket-header"><a class="brand" href="index.html"><img src="assets/caipsd-logo.png" alt="CAIPSD" class="ticket-header-logo" /></a></header>
  <main class="ticket-page">
    <div class="success-heading"><span class="success-icon">✓</span><div><div class="ticket-kicker" id="ticket-kicker">CAIPSD EVENT TICKET</div><h1 id="ticket-headline">Ready for <em>entry.</em></h1><p id="ticket-subcopy">Show this QR code at the entrance. It can be scanned any time while the ticket is valid.</p></div></div>
    <div id="ticket-state" class="ticket-state"><span class="spinner"></span> Preparing your digital ticket…</div>
    <div id="tickets-container" class="tickets-container"></div>
    <div id="ticket-actions" class="ticket-actions" hidden><button class="button button-dark" id="print-ticket">Print / Save as PDF <span>↗</span></button><button class="button button-ghost" id="copy-link" type="button">Copy ticket link</button><div class="copy-note" id="copy-note" role="status"></div></div>
    <div class="ticket-help">Need help with your ticket? Please contact the CAIPSD event organisers.</div>
  </main>
  <script src="assets/ticket.js" defer></script>
</body>
</html>
